# version: '3.8'

services:
 db:
    image: mysql:8.0
    container_name: finance_db  
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql
    networks:
      - finance_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 20s
      timeout: 20s
      retries: 5

 redis:
   image: redis:7-alpine
   container_name: finance_redis
   restart: always
   volumes:
     - redis_data:/data
   networks:
     - finance_network

 web:
    build: 
      context: ./app
      dockerfile: Dockerfile
    image: atdon/interview_latest
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_USER=${DB_USER}
      - DB_NAME=${DB_NAME}
      - REDIS_URL=redis://redis:6379/0
    networks:
      - finance_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5

 nginx:
    image: nginx:latest
    container_name: finance_nginx
    restart: always
    depends_on:
      - web
    ports:
      - 80:80
    networks:
      - finance_network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

 # ---- Monitoring Stack (DevSecOps) ----
 prometheus:
    image: prom/prometheus:latest
    container_name: finance_prometheus
    restart: always
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9091"
    networks:
      - finance_network
    depends_on:
      - web

 grafana:
    image: grafana/grafana:latest
    container_name: finance_grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - finance_network
    depends_on:
      - prometheus

networks:
   finance_network:
     driver: bridge

volumes:
    db_data:
    redis_data:
    prometheus_data:
    grafana_data:
