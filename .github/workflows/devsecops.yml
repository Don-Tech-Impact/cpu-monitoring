name: DevSecOps Pipeline

on:
  push:
    branches: [main, dev/*]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: atdon/interview_latest
  DOCKER_TAG: ${{ github.sha }}

jobs:
  # ---- Stage 1: Security Scanning ----
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install security tools
        run: |
          pip install bandit safety

      - name: Bandit - Python SAST scan
        run: bandit -r app/ -f json -o bandit-report.json --exit-zero

      - name: Safety - Dependency vulnerability scan
        run: safety check -r app/requirements.txt --output json > safety-report.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

  # ---- Stage 2: Lint & Test ----
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt
          pip install flake8 pytest

      - name: Flake8 lint
        run: flake8 app/ --max-line-length=120 --exit-zero

      - name: Run tests
        run: |
          cd app
          python -m pytest tests/ -v --tb=short || echo "No tests yet - add tests to app/tests/"

  # ---- Stage 3: Docker Build + Trivy Scan ----
  docker-build:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: [security-scan, lint-and-test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} ./app

      - name: Trivy - Container vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          format: table
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Login to DockerHub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to DockerHub
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} ${{ env.DOCKER_IMAGE }}:latest
          docker push ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          docker push ${{ env.DOCKER_IMAGE }}:latest

  # ---- Stage 4: Terraform Validate ----
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform Init
        run: |
          cd terraform
          terraform init -backend=false

      - name: Terraform Validate
        run: |
          cd terraform
          terraform validate

      - name: tfsec - Terraform security scan
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: terraform/
          soft_fail: true

  # ---- Stage 5: Deploy (manual gate) ----
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [docker-build, terraform-validate]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/app
            docker compose pull
            docker compose up -d --force-recreate
            docker system prune -f
